name: Release

# Auto-creates a GitHub Release whenever a semver tag (v1.2.3) is pushed.
# This is a pure Go library, so there are no binaries to build or upload —
# the "release" is a Git tag plus human-readable notes generated from the
# commits/PRs merged since the previous tag.
on:
  push:
    tags: ["v*"]

# Default-deny at the workflow level: a job that declares nothing gets read.
# Only the job that publishes gets write, so a compromised step in `verify`
# cannot touch the repository.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Gate the release on a green build/test so we never publish a broken tag.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Pinned to a commit SHA, not a tag: a tag is mutable, and an action
      # resolved by tag runs whatever that tag points at on the day the
      # workflow fires. release-module.yaml pins the same way.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go test ./...

  release:
    name: Publish release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      # Creates the release and nothing else.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so release notes can diff against the previous tag
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          # Auto-generate the changelog from commits/PRs since the last tag,
          # categorized per .github/release.yml.
          generate_release_notes: true
          # Mark pre-1.0 / -rc / -beta tags as pre-releases automatically.
          prerelease: ${{ contains(github.ref_name, '-') }}
