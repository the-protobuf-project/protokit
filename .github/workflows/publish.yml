name: Publish (BSR)

# Publishes the protobuf/ module to the Buf Schema Registry
# (https://buf.build/the-protobuf-project/protokit) on version-tag releases (v*),
# so BSR module versions line up with GitHub releases (see release.yml). Proto
# lint / format / build checks run in ci.yml, so this workflow only pushes.
#
# The module is protokit.v1: the neutral annotation vocabulary protokit reads
# directly. Schema authors depend on it from buf.yaml; Go consumers get the
# committed stubs under protobuf/protokitpbv1 with the library itself.
#
# Requires a BUF_TOKEN secret: a BSR API token with write access to the
# the-protobuf-project organization. Add it under
# Settings → Secrets and variables → Actions → New repository secret.
# The action auto-creates the BSR repository on first push.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  push:
    name: buf push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history + tags so --git-metadata carries the correct release info.
          fetch-depth: 0

      - name: Install buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to BSR
        env:
          # buf authenticates to buf.build from BUF_TOKEN.
          BUF_TOKEN: ${{ secrets.BUF_TOKEN }}
        # One named module in this workspace, so a bare push is unambiguous.
        # --create makes the first release auto-create the (public) BSR
        # repository; --git-metadata stamps the tag.
        run: buf push --create --create-visibility public --git-metadata
