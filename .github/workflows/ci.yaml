name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-ed:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  boundary:
    # protokit is the neutral layer: it reads AIP and nothing else, and every
    # annotation vocabulary reaches it through the SPI rather than through an
    # import. The moment protokit imports entity.v1, store.v1, or web3.v1
    # directly, the engine gains a compile-time dependency on one of its own
    # consumers and the vocabularies stop being pluggable.
    #
    # The gate has no exemptions, including for a vocabulary protokit might own
    # itself — protokit.v1 was one, and removing it is what let the last one go.
    #
    # This runs as its own job rather than only inside `go test ./...` so the gate
    # is a named check on the pull request. Violating it is an architectural
    # change, and it should be visible as one rather than as a line in a test log.
    name: Import boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: protokit imports no plugin proto module
        run: go test -run 'TestNoPluginProtoImports|TestBoundaryPatterns|TestNeutralTypesStayPlain' -v .

  test:
    # Build and test the library natively on Linux and Windows, on both x86-64
    # and arm64 (GitHub-hosted arm64 runners are free for public repositories).
    name: Test ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest      # linux / amd64
          - ubuntu-24.04-arm   # linux / arm64
          - windows-latest     # windows / amd64
          - windows-11-arm     # windows / arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./...

  # A separate race-detector pass on linux/amd64, where cgo + the race runtime are
  # always available; kept out of the cross-platform matrix so arm64/windows CI
  # stays green regardless of race-detector support there.
  race:
    name: Race (linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...
