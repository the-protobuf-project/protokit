name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-ed:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  proto:
    # protokit.v1 is the neutral annotation vocabulary protokit reads directly
    # (protobuf/protokit/v1/). Its Go stubs are committed under
    # protobuf/protokitpbv1/ so consumers need no code-generation step — which only
    # works if the committed stubs can never drift from the .proto sources, hence
    # the staleness gate.
    name: Proto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - run: buf lint
      - run: buf format --diff --exit-code
      - run: buf build
      - run: buf generate
      - name: Fail if the committed stubs are stale
        run: |
          git diff --exit-code -- protobuf/ || {
            echo "protobuf/protokitpbv1/ is stale — run 'buf generate' and commit the result"
            exit 1
          }

  api-lint:
    # Google's API linter checks protokit.v1 against the AIP conventions the IR is
    # built around. protokit reads google.api.resource / field_behavior /
    # resource_reference as its primary inference sources, so its own vocabulary
    # holding to the same conventions is not decoration — it is the thing keeping
    # the neutral layer honest.
    name: API lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned to the exact release: the action's README advertises @v1, but no
      # moving v1 tag has been pushed — v1.0.0 is the only tag that resolves.
      - uses: the-protobuf-project/setup-google-api-linter@v1.0.0
        with:
          # Run from the module root so each import resolves the way buf sees it
          # ("protokit/v1/column.proto"), not relative to the repository root.
          working-directory: protobuf
          paths: protokit/**/*.proto
          github-token: ${{ secrets.GITHUB_TOKEN }}

  test:
    # Build and test the library natively on Linux and Windows, on both x86-64
    # and arm64 (GitHub-hosted arm64 runners are free for public repositories).
    name: Test ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest      # linux / amd64
          - ubuntu-24.04-arm   # linux / arm64
          - windows-latest     # windows / amd64
          - windows-11-arm     # windows / arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./...

  # A separate race-detector pass on linux/amd64, where cgo + the race runtime are
  # always available; kept out of the cross-platform matrix so arm64/windows CI
  # stays green regardless of race-detector support there.
  race:
    name: Race (linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...
