syntax = "proto3";

package protokit.v1;

import "google/protobuf/descriptor.proto";
import "protokit/v1/column.proto";
import "protokit/v1/datasource.proto";
import "protokit/v1/table.proto";

option go_package = "github.com/the-protobuf-project/protokit/protobuf/protokitpbv1;protokitpbv1";
option java_multiple_files = true;
option java_outer_classname = "AnnotationsProto";
option java_package = "com.protokit.v1";

// annotations.proto is the single import a schema author needs:
//
//	import "protokit/v1/annotations.proto";
//
// protokit.v1 is the *neutral* vocabulary: the structure that decides what things
// are named and which of them exist. protokit reads it directly, so every
// generator built on protokit — a database generator, a chain generator, a
// documentation generator — derives the same databases, schemas, tables, and
// columns from the same protos.
//
// It deliberately expresses nothing storage-specific. Physical rendering (column
// types, sizing, defaults, constraints, referential actions, query surfaces) is
// each generator's own concern and lives in that generator's own annotation
// module alongside these options.
//
// It lives here, in protokit, rather than in any plugin: every plugin imports
// protokit, so a vocabulary protokit reads directly cannot live downstream of it
// without a release-ordering cycle. protokit owns what protokit reads.
//
// Precedence, highest first:
//
//  1. google.api.resource            → database, schema, table names
//  2. google.api.field_behavior      → NOT NULL, primary key
//  3. google.api.resource_reference  → foreign keys
//  4. protokit.v1.datasource/.table/.column → structure AIP cannot express
//  5. the plugin's layout config, then protokit's package-path defaults
//
// Field numbers 50000-99999 are reserved for non-Google options. protokit.v1 uses
// 51000-51002, clear of the 50000-50003 range already taken by the generator
// packages built on it, so a file may carry both vocabularies during migration.
extend google.protobuf.FileOptions {
  // datasource groups the file's messages into a database and names its schema.
  DatasourceOptions datasource = 51000;
}

extend google.protobuf.MessageOptions {
  // table overrides table-level structure: name, skip, id strategy, timestamps,
  // indexes.
  TableOptions table = 51001;
}

extend google.protobuf.FieldOptions {
  // column overrides column-level structure: name and skip.
  ColumnOptions column = 51002;
}
