version: v2

# This buf.yaml defines the publishable BSR module for the neutral annotation
# vocabulary protokit reads directly:
#   protobuf/  — buf.build/the-protobuf-project/protokit (package protokit.v1)
#
# Every other annotation module stays with its own plugin (store.v1 in store,
# web3.v1 in web3). This one lives here because protokit reads it: a vocabulary
# the engine depends on cannot live in a plugin that depends on the engine.
#
# protokit.v1 imports only google/protobuf/descriptor.proto (a well-known type),
# so this module has no BSR deps and no buf.lock. That is deliberate — depending
# on the neutral vocabulary should be cheap.
modules:
  - path: protobuf
    name: buf.build/the-protobuf-project/protokit

lint:
  use:
    - STANDARD
  except:
    - PACKAGE_VERSION_SUFFIX # protokit.v1 is intentionally version-suffixed

breaking:
  use:
    - FILE # enforce no breaking changes at the file level
